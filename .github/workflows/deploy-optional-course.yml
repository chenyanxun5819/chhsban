name: Deploy Optional Course Frontend to Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'optional-course/frontend/**'
      - 'packages/**'
      - '.github/workflows/deploy-optional-course.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'optional-course/frontend/package-lock.json'

      # optional-course/frontend 依賴 @chhsban/kv-utils 的 "file:" 依賴；其 dist/
      # 已被 gitignore，所以要在這裡先建置好，optional-course/frontend 的 npm ci 才能複製進去。
      # `|| true`：src/teacher-verify.ts 有既存、與本專案無關的 KVNamespace 型別錯誤
      # （缺少 @cloudflare/workers-types 環境型別）會讓 tsc 回傳非 0，但 tsc 仍會照常輸出 dist/。
      - name: Build @chhsban/kv-utils
        working-directory: packages/kv-utils
        run: |
          npm install
          npm run build || true

      - name: Install dependencies (optional-course frontend)
        working-directory: optional-course/frontend
        run: npm ci

      - name: Build optional-course frontend
        working-directory: optional-course/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: https://optional-course-system.astcws.workers.dev/api

      - name: Deploy to Cloudflare Pages
        working-directory: optional-course/frontend
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          wrangler pages deploy dist --project-name=optional-course --commit-dirty=true

      - name: Comment on commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅ Deploy succeeded' : '❌ Deploy failed';
            console.log(`${status}: optional-course.pages.dev`);
