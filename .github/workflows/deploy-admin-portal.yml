name: Deploy Admin Portal to Cloudflare Pages

on:
  push:
    branches:
      - master
    paths:
      - 'admin-portal/**'
      - '.github/workflows/deploy-admin-portal.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'admin-portal/package-lock.json'

      - name: Install dependencies (admin-portal)
        working-directory: admin-portal
        run: npm ci

      - name: Type-check admin-portal
        working-directory: admin-portal
        run: npx tsc --noEmit

      - name: Build admin-portal
        working-directory: admin-portal
        run: npm run build
        env:
          VITE_AUTH_API_BASE_URL: https://tution-system.astcws.workers.dev/api
          VITE_TUTION_API_BASE_URL: https://tution-system.astcws.workers.dev/api
          VITE_OPTIONAL_COURSE_API_BASE_URL: https://optional-course-system.astcws.workers.dev/api

      # Cloudflare Pages 專案名稱 chhsban-admin → https://chhsban-admin.pages.dev
      - name: Deploy to Cloudflare Pages
        working-directory: admin-portal
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install -g wrangler
          wrangler pages deploy dist --project-name=chhsban-admin --commit-dirty=true
