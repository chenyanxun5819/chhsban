<!-- 教師管理系統 - 測試客戶端 -->
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師管理系統 - 測試客戶端</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
      padding: 30px;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .panel h2 {
      font-size: 18px;
      color: #333;
      margin-top: 20px;
      margin-bottom: 10px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }

    .panel h2:first-child {
      margin-top: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
      text-transform: uppercase;
    }

    .form-group input,
    .form-group select {
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .button-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 100px;
      padding: 10px 15px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-primary:hover {
      background: #5568d3;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-success {
      background: #48bb78;
      color: white;
    }

    .btn-success:hover {
      background: #38a169;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(72, 187, 120, 0.4);
    }

    .btn-danger {
      background: #f56565;
      color: white;
    }

    .btn-danger:hover {
      background: #e53e3e;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(245, 101, 101, 0.4);
    }

    .btn-secondary {
      background: #cbd5e0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #a0aec0;
    }

    .response-section {
      background: #f7fafc;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 15px;
      margin-top: 15px;
      max-height: 400px;
      overflow-y: auto;
    }

    .response-section h3 {
      font-size: 13px;
      color: #666;
      margin-bottom: 10px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .response-code {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      padding: 12px;
      font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
      font-size: 12px;
      color: #333;
      overflow-x: auto;
    }

    .status-success {
      color: #48bb78;
    }

    .status-error {
      color: #f56565;
    }

    .teacher-list {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .teacher-item {
      padding: 15px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.3s ease;
    }

    .teacher-item:hover {
      background: #f7fafc;
    }

    .teacher-item:last-child {
      border-bottom: none;
    }

    .teacher-info {
      flex: 1;
    }

    .teacher-name {
      font-weight: 600;
      color: #333;
      margin-bottom: 5px;
    }

    .teacher-detail {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    .teacher-actions {
      display: flex;
      gap: 8px;
      margin-left: 15px;
    }

    .teacher-actions button {
      padding: 6px 12px;
      font-size: 11px;
      min-width: auto;
      flex: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #e2e8f0;
      border-top: 3px solid #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎓 教師管理系統</h1>
      <p>Cloudflare Workers 教師資料管理測試客戶端</p>
    </div>

    <div class="content">
      <!-- 左側：操作面板 -->
      <div class="panel">
        <h2>API 配置</h2>
        <div class="form-group">
          <label>Worker URL</label>
          <input
            id="workerUrl"
            type="url"
            placeholder="https://teacher-management.chhsban.workers.dev"
            value="http://localhost:8787"
          >
        </div>
        <div class="form-group">
          <label>API Key</label>
          <input id="apiKey" type="password" placeholder="your_api_key">
        </div>
        <button class="btn-secondary" onclick="testHealth()">🔍 測試連接</button>

        <h2>新增教師</h2>
        <div class="form-group">
          <label>教師 ID</label>
          <input id="teacherId" type="text" placeholder="T001">
        </div>
        <div class="form-group">
          <label>中文姓名</label>
          <input id="nameCn" type="text" placeholder="王老師">
        </div>
        <div class="form-group">
          <label>英文姓名</label>
          <input id="nameEn" type="text" placeholder="Mr. Wong">
        </div>
        <div class="form-group">
          <label>部門</label>
          <input id="department" type="text" placeholder="中文系">
        </div>
        <div class="form-group">
          <label>電郵</label>
          <input id="email" type="email" placeholder="teacher@chhsban.edu.my">
        </div>
        <div class="form-group">
          <label>電話</label>
          <input id="phone" type="tel" placeholder="0162345678">
        </div>
        <div class="form-group">
          <label>權限</label>
          <select id="permission">
            <option value="teacher">教師</option>
            <option value="admin">管理員</option>
            <option value="super_admin">超級管理員</option>
          </select>
        </div>
        <button class="btn-primary" onclick="createTeacher()">➕ 新增教師</button>

        <h2>查詢操作</h2>
        <button class="btn-success" onclick="listTeachers()">📋 查詢所有教師</button>
        <div class="form-group">
          <label>教師 ID</label>
          <input id="queryTeacherId" type="text" placeholder="T001">
        </div>
        <button class="btn-success" onclick="getTeacher()">🔎 查詢單個教師</button>
        <div class="form-group">
          <label>部門名稱</label>
          <input id="queryDepartment" type="text" placeholder="中文系">
        </div>
        <button class="btn-success" onclick="listByDepartment()">🏢 按部門查詢</button>

        <h2>修改/刪除</h2>
        <div class="form-group">
          <label>教師 ID</label>
          <input id="updateTeacherId" type="text" placeholder="T001">
        </div>
        <div class="form-group">
          <label>新電話 (選填)</label>
          <input id="newPhone" type="tel" placeholder="0187654321">
        </div>
        <div class="button-group">
          <button class="btn-primary" onclick="updateTeacher()" style="flex: 2;">✏️ 修改教師</button>
          <button class="btn-danger" onclick="deleteTeacher()" style="flex: 1;">🗑️ 刪除</button>
        </div>

        <div class="response-section">
          <h3>API 狀態</h3>
          <div id="status" class="response-code">待命中...</div>
        </div>
      </div>

      <!-- 右側：教師列表和回應 -->
      <div class="panel">
        <h2>教師列表</h2>
        <div id="teacherList" class="teacher-list">
          <div class="loading">點擊「查詢所有教師」載入資料</div>
        </div>

        <div class="response-section" style="margin-top: 30px;">
          <h3>API 回應</h3>
          <div id="response" class="response-code">待命中...</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function getApiUrl(path) {
      const baseUrl = document.getElementById("workerUrl").value.trim();
      return `${baseUrl}${path}`;
    }

    function getHeaders() {
      const apiKey = document.getElementById("apiKey").value.trim();
      return {
        "Content-Type": "application/json",
        ...(apiKey && { "Authorization": `Bearer ${apiKey}` })
      };
    }

    function updateStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.className = `response-code ${isError ? "status-error" : "status-success"}`;
    }

    function updateResponse(data) {
      const response = document.getElementById("response");
      response.textContent = JSON.stringify(data, null, 2);
    }

    async function testHealth() {
      try {
        updateStatus("測試中...");
        const response = await fetch(getApiUrl("/api/health"), {
          headers: getHeaders()
        });
        const data = await response.json();
        updateResponse(data);
        updateStatus("✓ 連接成功", false);
      } catch (error) {
        updateStatus(`✗ 連接失敗: ${error.message}`, true);
        updateResponse({ error: error.message });
      }
    }

    async function listTeachers() {
      try {
        updateStatus("載入中...");
        const response = await fetch(getApiUrl("/api/teachers"), {
          headers: getHeaders()
        });
        const data = await response.json();
        updateResponse(data);

        if (data.success && data.data) {
          renderTeacherList(data.data);
          updateStatus(`✓ 載入 ${data.data.length} 位教師`, false);
        } else {
          updateStatus("✗ 載入失敗", true);
        }
      } catch (error) {
        updateStatus(`✗ 錯誤: ${error.message}`, true);
      }
    }

    async function getTeacher() {
      const id = document.getElementById("queryTeacherId").value.trim();
      if (!id) {
        updateStatus("請輸入教師 ID", true);
        return;
      }

      try {
        updateStatus("查詢中...");
        const response = await fetch(getApiUrl(`/api/teachers/${id}`), {
          headers: getHeaders()
        });
        const data = await response.json();
        updateResponse(data);

        if (data.success) {
          renderTeacherList([data.data]);
          updateStatus("✓ 查詢成功", false);
        } else {
          updateStatus(`✗ ${data.error}`, true);
        }
      } catch (error) {
        updateStatus(`✗ 錯誤: ${error.message}`, true);
      }
    }

    async function listByDepartment() {
      const dept = document.getElementById("queryDepartment").value.trim();
      if (!dept) {
        updateStatus("請輸入部門名稱", true);
        return;
      }

      try {
        updateStatus("查詢中...");
        const response = await fetch(getApiUrl(`/api/teachers?department=${encodeURIComponent(dept)}`), {
          headers: getHeaders()
        });
        const data = await response.json();
        updateResponse(data);

        if (data.success && data.data) {
          renderTeacherList(data.data);
          updateStatus(`✓ 查詢成功 (${data.data.length} 位)`, false);
        } else {
          updateStatus("✗ 查詢失敗", true);
        }
      } catch (error) {
        updateStatus(`✗ 錯誤: ${error.message}`, true);
      }
    }

    async function createTeacher() {
      const id = document.getElementById("teacherId").value.trim();
      const nameCn = document.getElementById("nameCn").value.trim();
      const nameEn = document.getElementById("nameEn").value.trim();
      const dept = document.getElementById("department").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const permission = document.getElementById("permission").value;

      if (!id || !nameCn || !dept || !email) {
        updateStatus("請填入所有必填欄位", true);
        return;
      }

      try {
        updateStatus("新增中...");
        const response = await fetch(getApiUrl("/api/teachers"), {
          method: "POST",
          headers: getHeaders(),
          body: JSON.stringify({
            teacher_id: id,
            name_cn: nameCn,
            name_en: nameEn,
            department: dept,
            email: email,
            phone: phone,
            permission: permission
          })
        });
        const data = await response.json();
        updateResponse(data);

        if (data.success) {
          updateStatus("✓ 新增成功", false);
          // 清空表單
          document.getElementById("teacherId").value = "";
          document.getElementById("nameCn").value = "";
          document.getElementById("nameEn").value = "";
          document.getElementById("department").value = "";
          document.getElementById("email").value = "";
          document.getElementById("phone").value = "";
          // 重新載入列表
          await listTeachers();
        } else {
          updateStatus(`✗ ${data.error}`, true);
        }
      } catch (error) {
        updateStatus(`✗ 錯誤: ${error.message}`, true);
      }
    }

    async function updateTeacher() {
      const id = document.getElementById("updateTeacherId").value.trim();
      const newPhone = document.getElementById("newPhone").value.trim();

      if (!id) {
        updateStatus("請輸入教師 ID", true);
        return;
      }

      try {
        updateStatus("修改中...");
        const body = {};
        if (newPhone) body.phone = newPhone;

        const response = await fetch(getApiUrl(`/api/teachers/${id}`), {
          method: "PUT",
          headers: getHeaders(),
          body: JSON.stringify(body)
        });
        const data = await response.json();
        updateResponse(data);

        if (data.success) {
          updateStatus("✓ 修改成功", false);
          await listTeachers();
        } else {
          updateStatus(`✗ ${data.error}`, true);
        }
      } catch (error) {
        updateStatus(`✗ 錯誤: ${error.message}`, true);
      }
    }

    async function deleteTeacher() {
      const id = document.getElementById("updateTeacherId").value.trim();

      if (!id) {
        updateStatus("請輸入教師 ID", true);
        return;
      }

      if (!confirm(`確定要刪除教師 ${id} 嗎？`)) {
        return;
      }

      try {
        updateStatus("刪除中...");
        const response = await fetch(getApiUrl(`/api/teachers/${id}`), {
          method: "DELETE",
          headers: getHeaders()
        });
        const data = await response.json();
        updateResponse(data);

        if (data.success) {
          updateStatus("✓ 刪除成功", false);
          document.getElementById("updateTeacherId").value = "";
          await listTeachers();
        } else {
          updateStatus(`✗ ${data.error}`, true);
        }
      } catch (error) {
        updateStatus(`✗ 錯誤: ${error.message}`, true);
      }
    }

    function renderTeacherList(teachers) {
      const list = document.getElementById("teacherList");

      if (!teachers || teachers.length === 0) {
        list.innerHTML = '<div class="loading">無教師資料</div>';
        return;
      }

      list.innerHTML = teachers.map(teacher => `
        <div class="teacher-item">
          <div class="teacher-info">
            <div class="teacher-name">${teacher.name_cn}${teacher.name_en ? ` (${teacher.name_en})` : ''}</div>
            <div class="teacher-detail">
              <div>ID: <strong>${teacher.teacher_id}</strong></div>
              <div>部門: <strong>${teacher.department}</strong></div>
              <div>電郵: <strong>${teacher.email}</strong></div>
              ${teacher.phone ? `<div>電話: <strong>${teacher.phone}</strong></div>` : ''}
              <div>權限: <strong>${teacher.permission}</strong></div>
            </div>
          </div>
          <div class="teacher-actions">
            <button class="btn-primary" onclick="selectTeacher('${teacher.teacher_id}')">編輯</button>
          </div>
        </div>
      `).join("");
    }

    function selectTeacher(id) {
      document.getElementById("updateTeacherId").value = id;
      document.getElementById("updateTeacherId").scrollIntoView({ behavior: "smooth" });
    }
  </script>
</body>
</html>
