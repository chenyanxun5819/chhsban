# Cloudflare Worker 配置 - tution-system（手動維護）
# 註：packages/cloudflare-config 的產生器早已與此檔脫節，不要用它重新產生。
#
# ⚠️ 部署一律用不帶 --env 的 `npx wrangler deploy`。
#    2026-10-01 已刪除從未承接流量的 [env.production] 區段（曾造成部署到錯誤 Worker 的事故），
#    現在誤打 --env production 只會直接報錯。

name = "tution-system"
account_id = "82d225cda80f37208228877b32268b26"
workers_dev = true
main = "src/index.ts"
compatibility_date = "2026-06-30"

# KV 綁定：跨系統共用的資料（登入 session、教師、學生名錄、教室）與本系統的資產、審計紀錄
[[kv_namespaces]]
binding = "STUDENT_KV"
id = "9d870e2344c84c74a1ed2f2851c93408"

[[kv_namespaces]]
binding = "TEACHER_KV"
id = "8892dc8c30984f4591850521a1b57ed8"

[[kv_namespaces]]
binding = "AUTH_KV"
id = "8ddeccbeeae9440fafba384d35205a81"

[[kv_namespaces]]
binding = "CLASSROOM_KV"
id = "43882431a6344d929976a1281ffca873"

[[kv_namespaces]]
binding = "ASSETS_KV"
id = "3159009d636640369959187fb7f85eee"

[[kv_namespaces]]
binding = "AUDIT_LOG_KV"
id = "b04b855097f848cebbb8d71207f4159c"

# D1 資料庫：補習班的班級、名單、排課例外、點名、設定（2026-10-01 由 KV 遷移上線，資料表見 migrations/）
# 原本的 TUTION_CLASS/ROSTER/ATTENDANCE/SCHEDULE_KV 已於 2026-10-01 刪除
[[d1_databases]]
binding = "DB"
database_name = "tution-db"
database_id = "6f097da0-b5d2-441a-b5bf-e431e02ad327"
migrations_dir = "migrations"

# R2 綁定配置（簽核紙本掃描檔、收據存檔）
[[r2_buckets]]
binding = "SIGNED_FORMS_BUCKET"
bucket_name = "tution-signed-forms"

# Service Binding：行政管理站「學生名單同步」手動觸發，經 RPC 呼叫 student-sync Worker 的 SyncService.runSync()
# （student-sync 的程式在 chhsban-acadoc/chhsban-acadoc/workers/sms-sync.js，需先部署它才有 SyncService）
[[services]]
binding = "STUDENT_SYNC"
service = "student-sync"
entrypoint = "SyncService"

# Google 登入（私人 Gmail）的 OAuth 用戶端 ID：Google Cloud 專案 CHHSBAN-ACADoc 的「CHHSBAN_ACA」。
# 這是公開值（前端網頁本來就會帶），不是機密；後端用它確認 ID token 是發給我們網站的
[vars]
GOOGLE_CLIENT_ID = "491731246647-gf63vkq4vso6uji4dilcd84g5aedocsf.apps.googleusercontent.com"

# Cron 觸發器：每日 UTC 16:00（= 馬來西亞時間 00:00）清理超過保留年限的班級、重新計算「各課程開課報表」
[triggers]
crons = ["0 16 * * *"]

# 敏感資訊一律用 wrangler secret 設置，絕不寫在此文件中：
# npx wrangler secret put AUTH_PENDING_SECRET
# npx wrangler secret put GOOGLE_VISION_API_KEY
