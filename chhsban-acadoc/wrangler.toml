name = "student-sync"
account_id = "82d225cda80f37208228877b32268b26"
workers_dev = true
main = "chhsban-acadoc/workers/index.ts"
compatibility_date = "2026-06-30"

# KV 綁定配置
[[kv_namespaces]]
binding = "students_KV"
id = "9d870e2344c84c74a1ed2f2851c93408"

[[kv_namespaces]]
