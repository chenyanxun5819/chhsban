id = "8ddeccbeeae9440fafba384d35205a81"

# 環境變數
# 環境變數
[vars]
SMS_BASE_URL = "http://sms.chhsban.edu.my"

# Cron 觸發器
# Cron 觸發器
[triggers]
crons = ["0 16 * * 7", "0 16 * * 2"]

# 敏感信息使用 wrangler secret 設置（不寫在此文件中）
