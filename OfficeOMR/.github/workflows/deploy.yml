name: Deploy OfficeOMR (Firebase)

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: officeomr-fe542

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account key
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace("${{ secrets.FIREBASE_SERVICE_ACCOUNT }}")) {
            throw "Missing secret: FIREBASE_SERVICE_ACCOUNT"
          }

          $saPath = Join-Path $env:RUNNER_TEMP "gcp-sa.json"
          Set-Content -Path $saPath -Value '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' -Encoding utf8
          "GOOGLE_APPLICATION_CREDENTIALS=$saPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy to Firebase
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting,functions,firestore:rules,storage