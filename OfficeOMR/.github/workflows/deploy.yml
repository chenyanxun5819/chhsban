name: Deploy to Firebase (Hosting + Rules)

# 注意：Cloud Function recognize_sheet 不在这里部署，
# 仍使用 scripts\deploy.ps1（gcloud）手动部署。

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许在 GitHub 网页上手动触发

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: firebase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # 不设 cache: 'npm'：仓库没有 package-lock.json 时会直接报错

      - name: Install Firebase CLI
        run: |
          npm install -g firebase-tools
          firebase --version

      - name: Verify Firebase configuration
        run: |
          for f in firebase.json .firebaserc firestore.rules firestore.indexes.json storage.rules web/index.html; do
            if [ -f "$f" ]; then
              echo "OK: $f"
            else
              echo "MISSING: $f"
              exit 1
            fi
          done

      - name: Deploy hosting, Firestore rules/indexes, Storage rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase deploy \
            --only hosting,firestore,storage \
            --project officeomr-fe542 \
            --token "$FIREBASE_TOKEN"

      - name: Post-deploy summary
        if: success()
        run: |
          echo "Deployed to project officeomr-fe542"
          echo "Web app: https://officeomr-fe542.web.app"

      - name: Failure hints
        if: failure()
        run: |
          echo "DEPLOYMENT FAILED. Check:"
          echo "1. GitHub -> Settings -> Secrets and variables -> Actions -> FIREBASE_TOKEN"
          echo "2. firebase.json / .firebaserc / rules files / web/ folder"
          echo "3. Local test: firebase deploy --only hosting --project officeomr-fe542"
          exit 1